services:
  db:
    image: ledgercore-db:local
    build:
      context: ./scripts
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_DB: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/local-env.sh}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?run scripts/local-env.sh}
    volumes:
      - ledger-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LEDGER_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ledger"]
      interval: 2s
      timeout: 2s
      retries: 20
  migrate:
    image: ledgercore-api:local
    build: .
    entrypoint: ["/bin/sh", "-ec", "ledger migrate && ledger seed"]
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?run scripts/local-env.sh}@db:5432/ledger?sslmode=disable
      DATABASE_URL: postgres://ledger_app:${LEDGER_DB_PASSWORD:?run scripts/local-env.sh}@db:5432/ledger?sslmode=disable
      LEDGER_OPERATOR_TOKEN: ${LEDGER_OPERATOR_TOKEN:?run scripts/local-env.sh}
      LEDGER_VIEWER_TOKEN: ${LEDGER_VIEWER_TOKEN:?run scripts/local-env.sh}
    depends_on:
      db:
        condition: service_healthy
  api:
    image: ledgercore-api:local
    build: .
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://ledger_app:${LEDGER_DB_PASSWORD:?run scripts/local-env.sh}@db:5432/ledger?sslmode=disable
      LEDGER_ADDR: 0.0.0.0:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LEDGER_API_PORT:-18080}:8080"
  dashboard:
    build: ./dashboard
    environment:
      LEDGER_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${LEDGER_DASHBOARD_PORT:-13000}:3000"
volumes:
  ledger-data:
